[project]
name = "quant-risk-analytics"
version = "1.0.0"
description = "Portfolio performance and risk analytics (historical VaR/ES, drawdowns, Sharpe) with a Streamlit dashboard."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["error::FutureWarning"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
# Pyflakes, pycodestyle, import order, bugbear, pyupgrade, simplify.
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
# The notebook puts the project root on sys.path before importing src.
"notebooks/*.ipynb" = ["E402"]
